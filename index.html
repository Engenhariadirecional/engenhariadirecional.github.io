<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engenharia Direcional</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 35px;
    }

    .botao {
      display: inline-block;
      padding: 18px 35px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
    }

    .botao:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Engenharia Direcional</h1>

    <p>Baixe o aplicativo da Engenharia Direcional.</p>

    <a class="botao" href="#">
      Baixar aplicativo
    </a>
  </div>

</body>
</html>
